<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf7f1;
    --card: #ffffff;
    --ink: #2b2620;
    --muted: #8a8074;
    --line: #ece4d8;
    --accent: #e0703a;
    --accent-soft: #fbe6da;
    --b: #f3b33d;  /* breakfast */
    --l: #6bab5a;  /* lunch */
    --d: #7a6bd1;  /* dinner */
    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 20px rgba(60,40,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1916; --card: #26231f; --ink: #f1ebe2; --muted: #a39887;
      --line: #36322c; --accent: #f08a55; --accent-soft: #3d2b20;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1916; --card: #26231f; --ink: #f1ebe2; --muted: #a39887;
    --line: #36322c; --accent: #f08a55; --accent-soft: #3d2b20;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 Inter, system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 60px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 30px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .today-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .today-btn:hover { border-color: var(--accent); }

  .daynav { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 12px; }
  .daynav button {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: transparent; color: var(--ink); font-size: 22px; cursor: pointer;
  }
  .daynav button:hover { background: var(--accent-soft); }
  .daylabel { text-align: center; }
  .daylabel .big { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 500; }
  .daylabel .small { font-size: 13px; color: var(--muted); }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 22px; }
  .wd {
    border: none; background: transparent; color: var(--ink); cursor: pointer;
    border-radius: 12px; padding: 8px 0 7px; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .wd:hover { background: var(--card); }
  .wd .n { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .wd .num { font-weight: 600; font-size: 15px; }
  .wd .dots { display: flex; gap: 3px; height: 6px; }
  .wd .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .wd .dots i.on.b { background: var(--b); }
  .wd .dots i.on.l { background: var(--l); }
  .wd .dots i.on.d { background: var(--d); }
  .wd.sel { background: var(--card); box-shadow: var(--shadow); }
  .wd.sel .num { color: var(--accent); }
  .wd.istoday .n { color: var(--accent); font-weight: 600; }

  .meal {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    padding: 16px 18px 14px; margin-bottom: 14px; border-left: 5px solid var(--c);
  }
  .meal.b { --c: var(--b); } .meal.l { --c: var(--l); } .meal.d { --c: var(--d); }
  .meal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .meal-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .meal-title .emoji { font-size: 20px; }
  .ate { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .ate input { accent-color: var(--c); width: 16px; height: 16px; cursor: pointer; }
  .meal textarea {
    width: 100%; border: none; resize: none; background: transparent; color: var(--ink);
    font: inherit; font-size: 17px; padding: 4px 0; outline: none; min-height: 30px; overflow: hidden;
  }
  .meal textarea::placeholder { color: var(--muted); opacity: .7; }
  .meal.done textarea { text-decoration: line-through; text-decoration-color: var(--c); text-decoration-thickness: 2px; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    border: 1px dashed var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .chip:hover { border-style: solid; border-color: var(--c); color: var(--ink); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .actions button {
    flex: 1 1 auto; border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .actions button:hover { border-color: var(--accent); background: var(--card); }

  footer { margin-top: 30px; font-size: 12.5px; color: var(--muted); text-align: center; }
  footer button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; padding: 0 4px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px;
    transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>What's for <span>dinner?</span></h1>
    <button class="today-btn" id="todayBtn">Today</button>
  </header>

  <div class="daynav">
    <button id="prev" aria-label="Previous day">‹</button>
    <div class="daylabel"><div class="big" id="bigDate"></div><div class="small" id="smallDate"></div></div>
    <button id="next" aria-label="Next day">›</button>
  </div>

  <div class="week" id="week"></div>
  <div id="meals"></div>

  <div class="actions">
    <button id="copyYesterday">↺ Copy from previous day</button>
    <button id="clearDay">Clear this day</button>
  </div>

  <footer>
    <span id="syncNote">Saved automatically.</span>
    <button id="exportBtn">Back up</button>·<button id="importBtn">Restore</button>·<button id="themeBtn">Theme</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'mealLog.v1';
const MEALS = [
  { id: 'b', name: 'Breakfast', emoji: '🍳', ph: 'Toast, eggs, coffee…' },
  { id: 'l', name: 'Lunch',     emoji: '🥗', ph: 'Something tasty…' },
  { id: 'd', name: 'Dinner',    emoji: '🍝', ph: 'Pasta night?' },
];

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
let data = load();   // { "2026-11-07": { b: {text, ate}, l: {...}, d: {...} } }

// Cloud sync: one private doc per signed-in person, so the log follows you across devices.
let remote = null, writing = false, dirty = false, saveTimer = null;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
  if (!remote) return;
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600);
}
async function flush() {
  if (!remote || writing || !dirty) return;
  writing = true; dirty = false;
  try { await remote.set({ days: data, updatedAt: Date.now() }); }
  catch { dirty = true; }
  finally { writing = false; if (dirty) saveTimer = setTimeout(flush, 1500); }
}
(async () => {
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const ref = db.doc('data/users/' + (await user.id()) + '/log');
    const snap = await Promise.race([ref.get(), new Promise((_, r) => setTimeout(r, 10000))]);
    const cloud = (snap.exists && snap.data().days) || {};
    const hadLocalOnly = Object.keys(data).some(k => !(k in cloud));
    data = { ...data, ...cloud };
    remote = ref;
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
    if (hadLocalOnly) { dirty = true; flush(); }
    render();
    document.getElementById('syncNote').textContent = 'Synced to your account.';
  } catch {}
})();

const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => keyOf(a) === keyOf(b);

let current = new Date(); current.setHours(12, 0, 0, 0);

function entry(k, m) { return (data[k] && data[k][m]) || { text: '', ate: false }; }
function setEntry(k, m, patch) {
  data[k] = data[k] || {};
  data[k][m] = { ...entry(k, m), ...patch };
  if (!data[k][m].text && !data[k][m].ate) delete data[k][m];
  if (!Object.keys(data[k]).length) delete data[k];
  save();
}

// Most frequent past foods per meal, for quick-pick chips
function favorites(m, exclude) {
  const counts = {};
  for (const k in data) {
    const t = data[k][m] && data[k][m].text.trim();
    if (t) counts[t] = (counts[t] || 0) + 1;
  }
  return Object.entries(counts)
    .filter(([t]) => t !== exclude)
    .sort((a, b) => b[1] - a[1]).slice(0, 4).map(([t]) => t);
}

function relLabel(d) {
  const today = new Date();
  if (sameDay(d, today)) return 'Today';
  if (sameDay(d, addDays(today, 1))) return 'Tomorrow';
  if (sameDay(d, addDays(today, -1))) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long' });
}

function renderHeader() {
  document.getElementById('bigDate').textContent = relLabel(current);
  document.getElementById('smallDate').textContent =
    current.toLocaleDateString(undefined, { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });
}

function renderWeek() {
  const start = addDays(current, -((current.getDay() + 6) % 7)); // Monday
  const today = new Date();
  const el = document.getElementById('week');
  el.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i), k = keyOf(d);
    const b = document.createElement('button');
    b.className = 'wd' + (sameDay(d, current) ? ' sel' : '') + (sameDay(d, today) ? ' istoday' : '');
    b.innerHTML = `<span class="n">${d.toLocaleDateString(undefined, { weekday: 'short' })}</span>
      <span class="num">${d.getDate()}</span>
      <span class="dots">${MEALS.map(m => `<i class="${m.id}${entry(k, m.id).text ? ' on' : ''}"></i>`).join('')}</span>`;
    b.onclick = () => { current = d; render(); };
    el.appendChild(b);
  }
}

function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

function renderMeals() {
  const k = keyOf(current);
  const wrap = document.getElementById('meals');
  wrap.innerHTML = '';
  for (const m of MEALS) {
    const e = entry(k, m.id);
    const card = document.createElement('div');
    card.className = `meal ${m.id}` + (e.ate ? ' done' : '');
    card.innerHTML = `
      <div class="meal-head">
        <div class="meal-title"><span class="emoji">${m.emoji}</span>${m.name}</div>
        <label class="ate"><input type="checkbox" ${e.ate ? 'checked' : ''}> ate it</label>
      </div>
      <textarea rows="1" placeholder="${m.ph}"></textarea>
      <div class="chips"></div>`;
    const ta = card.querySelector('textarea');
    const cb = card.querySelector('input');
    const chips = card.querySelector('.chips');
    ta.value = e.text;

    const drawChips = () => {
      chips.innerHTML = '';
      if (ta.value.trim()) return;
      for (const f of favorites(m.id, ta.value.trim())) {
        const c = document.createElement('button');
        c.className = 'chip'; c.textContent = f;
        c.onclick = () => { ta.value = f; setEntry(k, m.id, { text: f }); autosize(ta); drawChips(); renderWeek(); };
        chips.appendChild(c);
      }
    };

    ta.addEventListener('input', () => { setEntry(k, m.id, { text: ta.value }); autosize(ta); renderWeek(); });
    ta.addEventListener('blur', drawChips);
    cb.addEventListener('change', () => { setEntry(k, m.id, { ate: cb.checked }); card.classList.toggle('done', cb.checked); });

    wrap.appendChild(card);
    requestAnimationFrame(() => autosize(ta));
    drawChips();
  }
}

function render() { renderHeader(); renderWeek(); renderMeals(); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('prev').onclick = () => { current = addDays(current, -1); render(); };
document.getElementById('next').onclick = () => { current = addDays(current, 1); render(); };
document.getElementById('todayBtn').onclick = () => { current = new Date(); current.setHours(12,0,0,0); render(); };

document.getElementById('copyYesterday').onclick = () => {
  const from = keyOf(addDays(current, -1)), to = keyOf(current);
  if (!data[from]) return toast('Nothing logged the day before');
  for (const m of MEALS) {
    const t = entry(from, m.id).text;
    if (t && !entry(to, m.id).text) setEntry(to, m.id, { text: t, ate: false });
  }
  render(); toast('Copied!');
};
document.getElementById('clearDay').onclick = () => {
  const k = keyOf(current);
  if (!data[k]) return;
  if (!confirm('Clear all meals for this day?')) return;
  delete data[k]; save(); render(); toast('Cleared');
};

document.getElementById('exportBtn').onclick = async () => {
  const json = JSON.stringify(data, null, 2), filename = `meal-log-${keyOf(new Date())}.json`;
  let dl = null;
  try { dl = typeof claude !== 'undefined' ? await claude.use('downloads') : null; } catch {}
  if (dl) {
    try { await dl.save({ filename, data: new Blob([json], { type: 'application/json' }) }); }
    catch (e) { if (e && e.code !== 'declined') toast("Couldn't save backup"); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const incoming = JSON.parse(await f.text());
    data = { ...data, ...incoming }; save(); render(); toast('Restored');
  } catch { toast("Couldn't read that file"); }
  e.target.value = '';
};

const root = document.documentElement;
try { const t = localStorage.getItem('mealLog.theme'); if (t) root.dataset.theme = t; } catch {}
document.getElementById('themeBtn').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('mealLog.theme', root.dataset.theme); } catch {}
};

render();
</script>
</body>
</html>
